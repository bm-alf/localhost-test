<!DOCTYPE html>
<html>
<head>
    <title>Cloud + Localhost</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Local page */
        .sidebar {
            width: 350px;
            min-width: 350px;
            border-right: 2px solid #ddd;
            background: #f5f5f5;
        }

        .sidebar-header {
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            background: #222;
            color: white;
            font-weight: bold;
        }

        .local-frame {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }

        /* Cloud page */
        .main {
            flex: 1;
        }

        .cloud-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOCALHOST SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">
            Localhost
        </div>

        <iframe
            class="local-frame"
            src="http://localhost:5000">
        </iframe>

    </aside>


    <!-- CLOUD PAGE -->
    <main class="main">

        <iframe
            class="cloud-frame"
            src="https://your-cloud-domain.com">
        </iframe>

    </main>

</div>

</body>
</html>
