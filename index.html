<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Local + Cloud</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .app {
        display: flex;
        width: 100%;
        height: 100vh;
    }

    /* ================================
       SIDEBAR
    ================================= */

    .sidebar {
        width: 220px;
        min-width: 220px;

        background: #111827;
        color: white;

        padding: 20px;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;

        margin-bottom: 30px;
    }

    .nav-button {
        display: block;

        width: 100%;

        margin-bottom: 8px;

        padding: 12px;

        border: none;
        border-radius: 7px;

        background: #1f2937;
        color: #e5e7eb;

        text-align: left;

        font-size: 15px;

        cursor: pointer;
    }

    .nav-button:hover {
        background: #374151;
    }

    .nav-button.active {
        background: #2563eb;
        color: white;
    }

    /* ================================
       MAIN
    ================================= */

    .main {
        flex: 1;

        min-width: 0;

        height: 100vh;

        display: flex;
        flex-direction: column;

        background: #f3f4f6;
    }

    /* ================================
       TOOLBAR
    ================================= */

    .toolbar {
        height: 50px;
        min-height: 50px;

        display: flex;
        align-items: center;

        gap: 6px;

        padding: 7px 10px;

        background: white;

        border-bottom: 1px solid #d1d5db;
    }

    .toolbar button {
        width: 34px;
        height: 34px;

        border: 1px solid #d1d5db;

        border-radius: 6px;

        background: white;

        font-size: 16px;

        cursor: pointer;
    }

    .toolbar button:hover {
        background: #f3f4f6;
    }

    .url-display {
        flex: 1;

        height: 34px;

        display: flex;
        align-items: center;

        padding: 0 12px;

        margin-left: 4px;

        background: #f3f4f6;

        border: 1px solid #d1d5db;

        border-radius: 6px;

        color: #6b7280;

        font-size: 13px;

        overflow: hidden;

        white-space: nowrap;
    }

    /* ================================
       MESSAGE AREA
    ================================= */

    .page-container {
        flex: 1;

        min-height: 0;

        display: flex;

        align-items: center;

        justify-content: center;

        background: #f3f4f6;
    }

    .welcome {
        text-align: center;

        color: #374151;
    }

    .welcome h1 {
        margin-bottom: 10px;
    }

    .welcome p {
        color: #6b7280;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 700px) {

        .sidebar {
            width: 170px;
            min-width: 170px;

            padding: 12px;
        }

        .logo {
            font-size: 17px;
        }

        .nav-button {
            font-size: 13px;
        }

    }

</style>

</head> <body>
<div class="app">

    <!-- ================================
         SIDEBAR
    ================================= -->

    <aside class="sidebar">

        <div class="logo">
            My Navigator
        </div>


        <button
            class="nav-button active"
            id="localButton"
            onclick="openLocal()"
        >
            🖥️ Local
        </button>


        <button
            class="nav-button"
            id="cloudButton"
            onclick="openCloud()"
        >
            ☁️ Cloud
        </button>

    </aside>


    <!-- ================================
         MAIN
    ================================= -->

    <main class="main">


        <!-- TOOLBAR -->

        <div class="toolbar">

            <button
                onclick="openCurrentPage()"
                title="Open"
            >
                ↗
            </button>


            <button
                onclick="reloadPage()"
                title="Reload"
            >
                ↻
            </button>


            <div
                class="url-display"
                id="urlDisplay"
            >
                Local
            </div>

        </div>


        <!-- CONTENT -->

        <div class="page-container">

            <div class="welcome">

                <h1>
                    Local + Cloud Navigator
                </h1>

                <p>
                    Select Local or Cloud from the left sidebar.
                </p>

            </div>

        </div>

    </main>

</div>


<script>

    /*
    =========================================
    YOUR ADDRESSES
    =========================================
    */

    const LOCAL_URL =
        "http://localhost:5000/api/users";


    const CLOUD_URL =
        "https://alfdigitalworld.com/alfiot/admin";


    /*
    =========================================
    ELEMENTS
    =========================================
    */

    const urlDisplay =
        document.getElementById("urlDisplay");


    const localButton =
        document.getElementById("localButton");


    const cloudButton =
        document.getElementById("cloudButton");


    /*
    =========================================
    OPEN LOCAL
    =========================================
    */

    function openLocal() {

        window.open(
            LOCAL_URL,
            "_blank"
        );


        urlDisplay.textContent =
            LOCAL_URL;


        localButton.classList.add("active");

        cloudButton.classList.remove("active");

    }


    /*
    =========================================
    OPEN CLOUD
    =========================================
    */

    function openCloud() {

        window.open(
            CLOUD_URL,
            "_blank"
        );


        urlDisplay.textContent =
            CLOUD_URL;


        cloudButton.classList.add("active");

        localButton.classList.remove("active");

    }


    /*
    =========================================
    OPEN CURRENT PAGE
    =========================================
    */

    function openCurrentPage() {

        const currentURL =
            cloudButton.classList.contains("active")
                ? CLOUD_URL
                : LOCAL_URL;


        window.open(
            currentURL,
            "_blank"
        );

    }


    /*
    =========================================
    RELOAD
    =========================================
    */

    function reloadPage() {

        const currentURL =
            cloudButton.classList.contains("active")
                ? CLOUD_URL
                : LOCAL_URL;


        window.open(
            currentURL,
            "_blank"
        );

    }

</script>

</body> </html>
