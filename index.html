<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Local + Cloud Navigator</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* =====================================
       MAIN APPLICATION
    ===================================== */

    .app {
        display: flex;
        width: 100%;
        height: 100vh;
    }

    /* =====================================
       LEFT SIDEBAR
    ===================================== */

    .sidebar {
        width: 250px;
        min-width: 250px;
        height: 100vh;

        background: #111827;
        color: white;

        padding: 20px;
        overflow-y: auto;
    }

    .logo {
        font-size: 21px;
        font-weight: bold;
        margin-bottom: 30px;
    }

    .section-title {
        margin-top: 20px;
        margin-bottom: 10px;

        color: #9ca3af;

        font-size: 11px;
        font-weight: bold;

        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* =====================================
       NAVIGATION BUTTONS
    ===================================== */

    .nav-button {
        display: block;

        width: 100%;

        margin-bottom: 7px;

        padding: 12px 14px;

        border: none;
        border-radius: 7px;

        background: #1f2937;
        color: #e5e7eb;

        text-align: left;

        font-size: 14px;

        cursor: pointer;

        transition:
            background 0.15s,
            color 0.15s;
    }

    .nav-button:hover {
        background: #374151;
        color: white;
    }

    .nav-button.active {
        background: #2563eb;
        color: white;
    }

    /* =====================================
       RIGHT SIDE
    ===================================== */

    .main {
        flex: 1;
        min-width: 0;
        height: 100vh;

        display: flex;
        flex-direction: column;

        background: #f3f4f6;
    }

    /* =====================================
       TOP TOOLBAR
    ===================================== */

    .toolbar {
        height: 50px;
        min-height: 50px;

        display: flex;
        align-items: center;

        gap: 6px;

        padding: 7px 10px;

        background: #ffffff;

        border-bottom: 1px solid #d1d5db;
    }

    .toolbar button {
        width: 34px;
        height: 34px;

        border: 1px solid #d1d5db;

        border-radius: 6px;

        background: white;

        font-size: 16px;

        cursor: pointer;
    }

    .toolbar button:hover {
        background: #f3f4f6;
    }

    .url-display {
        flex: 1;

        height: 34px;

        display: flex;
        align-items: center;

        padding: 0 12px;

        margin-left: 4px;

        background: #f3f4f6;

        border: 1px solid #d1d5db;
        border-radius: 6px;

        color: #6b7280;

        font-size: 13px;

        overflow: hidden;
        white-space: nowrap;
    }

    /* =====================================
       PAGE FRAME
    ===================================== */

    .page-container {
        flex: 1;
        min-height: 0;
    }

    #page {
        display: block;

        width: 100%;
        height: 100%;

        border: none;

        background: white;
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 700px) {

        .sidebar {
            width: 190px;
            min-width: 190px;
            padding: 12px;
        }

        .logo {
            font-size: 17px;
        }

        .nav-button {
            font-size: 12px;
            padding: 10px;
        }

    }

</style>

</head> <body>
<div class="app">

    <!-- =================================
         LEFT SIDEBAR
    ================================== -->

    <aside class="sidebar">

        <div class="logo">
            Local + Cloud
        </div>

        <div class="section-title">
            Pages
        </div>

        <button
            class="nav-button active"
            id="localButton"
            onclick="openLocal()"
        >
            🖥️ Local
        </button>

        <button
            class="nav-button"
            id="cloudButton"
            onclick="openCloud()"
        >
            ☁️ Cloud
        </button>

    </aside>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <main class="main">

        <!-- TOP TOOLBAR -->

        <div class="toolbar">

            <button
                onclick="goBack()"
                title="Back"
            >
                ←
            </button>

            <button
                onclick="goForward()"
                title="Forward"
            >
                →
            </button>

            <button
                onclick="reloadPage()"
                title="Reload"
            >
                ↻
            </button>

            <div
                class="url-display"
                id="urlDisplay"
            >
                Local Page
            </div>

        </div>


        <!-- PAGE -->

        <div class="page-container">

            <iframe
                id="page"
                src="local.html"
                title="Page Viewer"
            ></iframe>

        </div>

    </main>

</div>


<script>

    /*
     * ==========================================
     * CHANGE THIS URL
     * ==========================================
     *
     * Put your GitHub Pages URL here.
     *
     * Example:
     *
     * https://username.github.io/repository/
     *
     */

    const CLOUD_URL =
        "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/";


    /*
     * ==========================================
     * ELEMENTS
     * ==========================================
     */

    const page = document.getElementById("page");

    const urlDisplay =
        document.getElementById("urlDisplay");

    const localButton =
        document.getElementById("localButton");

    const cloudButton =
        document.getElementById("cloudButton");


    /*
     * ==========================================
     * OPEN LOCAL PAGE
     * ==========================================
     */

    function openLocal() {

        page.src = "local.html";

        urlDisplay.textContent =
            "Local Page";

        localButton.classList.add("active");

        cloudButton.classList.remove("active");
    }


    /*
     * ==========================================
     * OPEN CLOUD PAGE
     * ==========================================
     */

    function openCloud() {

        page.src = CLOUD_URL;

        urlDisplay.textContent =
            CLOUD_URL;

        cloudButton.classList.add("active");

        localButton.classList.remove("active");
    }


    /*
     * ==========================================
     * BACK
     * ==========================================
     */

    function goBack() {

        try {
            page.contentWindow.history.back();
        }
        catch (error) {
            console.log(
                "Cannot control history of external page."
            );
        }
    }


    /*
     * ==========================================
     * FORWARD
     * ==========================================
     */

    function goForward() {

        try {
            page.contentWindow.history.forward();
        }
        catch (error) {
            console.log(
                "Cannot control history of external page."
            );
        }
    }


    /*
     * ==========================================
     * RELOAD
     * ==========================================
     */

    function reloadPage() {

        page.src = page.src;
    }

</script>

</body> </html>
